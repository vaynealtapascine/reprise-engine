[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/vaynealtapascine/reprise-engine"
publish = false

[workspace.dependencies]
reprise-diag = { path = "crates/diag" }
reprise-geom = { path = "crates/geom" }
reprise-text = { path = "crates/text" }
reprise-doc = { path = "crates/doc" }
reprise-format = { path = "crates/format" }
reprise-font = { path = "crates/font" }
reprise-shape = { path = "crates/shape" }
reprise-compose = { path = "crates/compose" }
reprise-layout = { path = "crates/layout" }
reprise-display = { path = "crates/display" }
reprise-fixtures = { path = "crates/fixtures" }
reprise-edit = { path = "crates/edit" }
reprise-plugin = { path = "crates/plugin" }

loro = "1.16"
thiserror = "2"
harfrust = "0.13"
skrifa = "0.46"
icu_segmenter = "2.3"
icu_properties = { version = "=2.3.0", features = ["unicode_bidi"] }
unicode-bidi = { version = "=0.3.18", default-features = false, features = ["std"] }
tiny-skia = "0.12"
krilla = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
insta = { version = "1.49", features = ["json"] }
lopdf = { version = "0.38", default-features = false }
wasmi = { version = "=2.0.0", default-features = false, features = ["stable", "std", "validate", "deterministic", "portable-dispatch", "prefer-btree-collections"] }
wasmparser = { version = "=0.228.0", default-features = false, features = ["std"] }
wat = { version = "=1.261.0", default-features = false }
